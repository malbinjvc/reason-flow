name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mlugg/setup-zig@v1
        with:
          version: '0.15.2'

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Health check
        run: ./zig-out/bin/reason-flow health

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: docker build -t reason-flow .

      - name: Test Docker health
        run: docker run --rm reason-flow health
