name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig (latest master)
        run: |
          ZIG_URL=$(curl -s https://ziglang.org/download/index.json | jq -r '.master."x86_64-linux".tarball')
          curl -L "$ZIG_URL" | tar -xJ
          ZIG_DIR=$(ls -d zig-linux-x86_64-*)
          echo "$PWD/$ZIG_DIR" >> $GITHUB_PATH

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Health check
        run: ./zig-out/bin/reason-flow health

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: docker build -t reason-flow .
